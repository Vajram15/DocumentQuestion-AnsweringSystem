version: '3.8'

services:
  api:
    build: .
    container_name: doc-qa-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_NAME=Document QA System
      - DEBUG=False
    volumes:
      - ./documents:/app/documents
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add Redis for caching in the future
